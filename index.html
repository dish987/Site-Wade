<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header - BeFarm</title>
    <link rel="stylesheet" href="frontend/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <a href="#" class="logo-link">
            <img src="frontend/img/beFarm.png" alt="BeFarm Logo" id="imgH">
        </a>

        <!-- Botão Mobile -->
        <button class="mobile-toggle" id="menuToggle" aria-label="Abrir menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <!-- Menu Principal -->
        <nav id="direitoH">
            <ul class="nav-links">
                <li><a href="#">Início</a></li>
                <li><a href="#">WadeBrasil</a></li>
                <li><a href="#">BluseSafe</a></li>
                <li><a href="#" id="beFarm">BeFarm</a></li>
                <li><a href="#">Catálogo</a></li>
            </ul>

            <div class="header-buttons">
                <a href="#" class="btn-header" id="botaoAPP">
                    <img src="frontend/img/logoAPP.png" alt="App Icon">
                    <span>APP</span>
                </a>
                <a href="#" class="btn-header" id="botaoADMIN">
                    <img src="frontend/img/configAdmin.png" alt="Admin Icon">
                    <span>DASHBOARD</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="main-content">
    </main>

    <!-- Rodapé -->
    <footer>
        <div class="infoFooter">
            <section class="imgEmpresas">
                <img src="frontend/img/beFarm.png" alt="BeFarm">
                <img src="frontend/img/wadeBrasil.png" alt="Wade Brasil">
                <img src="frontend/img/blueSafe.png" alt="Blue Safe">
            </section>

            <section class="caixasP mapaSite">
                <h6 class="h6C">Mapa do Site</h6>
                <a href="#">Início</a>
                <a href="#">Quem Somos?</a>
                <a href="#">Catálogo</a>
            </section>

            <section class="caixasP suporte">
                <h6 class="h6C">Suporte</h6>
                <a href="#">FAQ</a>
            </section>

            <section class="caixasP empresas">
                <h6 class="h6C">Empresas</h6>
                <a href="#">Wade Brasil</a>
                <a href="#">BlueSafe</a>
                <a href="#">BeFarm</a>
            </section>

            <section class="redesSociais">
                <div class="sitesLogo">
                    <a href="#"><img src="frontend/img/instagram.png" alt="Instagram"></a>
                    <a href="#"><img src="frontend/img/facebook.png" alt="Facebook"></a>
                    <a href="#"><img src="frontend/img/twitter.png" alt="Twitter"></a>
                </div>
                <a href="#" class="contatoButton">
                    <span>Contato</span>
                </a>
            </section>
        </div>

        <div class="direitosFooter">
            <p>© 2026 Wade. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('direitoH');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
    </script>
</body>
</html>
